services:
  mariadb:
    # Локальная сборка: docker build -t thalidzhokov/mariadb:11.8 .
    image: thalidzhokov/mariadb:11.8
    restart: unless-stopped
    environment:
      # ///////////////////////////////////////////////////////////
      # Встроенные переменные
      # ///////////////////////////////////////////////////////////
      MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
      MARIADB_DATABASE: $MARIADB_DATABASE
      MARIADB_USER: $MARIADB_USER
      MARIADB_PASSWORD: $MARIADB_PASSWORD
      # Автоматическое обновление базы данных.
      # Без него на томе, созданном старым образом, не создаются пользователи
      # healthcheck, и HEALTHCHECK контейнера навсегда остается в health: starting
      MARIADB_AUTO_UPGRADE: "1"
      # Опционально, если не нужно создавать резервные копии перед обновлением
      # MARIADB_DISABLE_UPGRADE_BACKUP: "1"
      # ///////////////////////////////////////////////////////////
      # Кастомы образа
      # ///////////////////////////////////////////////////////////
      # Кастом для создания пользователя debezium при первой инициализации тома
      # Если переменная не указана, пользователя не создаем
      MARIADB_DEBEZIUM_PASSWORD: ${MARIADB_DEBEZIUM_PASSWORD:-}
      # Для полной проверки: bash scripts/healthcheck.sh (не Docker HEALTHCHECK)
      # Если таблица не указана, scripts/healthcheck.sh её не проверяет
      MARIADB_HEALTHCHECK_TABLE: ${MARIADB_HEALTHCHECK_TABLE:-}
      # Дополнительно можем проверить наличие индекса, для первичного ключа это PRIMARY
      # Работает только когда указана таблица MARIADB_HEALTHCHECK_TABLE
      # Если индекс не указан, scripts/healthcheck.sh его не проверяет
      MARIADB_HEALTHCHECK_INDEX: ${MARIADB_HEALTHCHECK_INDEX:-}
      # Расчет параметров при запуске контейнера
      # MARIADB_AUTOTUNE=0 отключает расчет целиком, MARIADB_AUTOTUNE_IO=0 - только замер IOPS
      # MARIADB_AUTOTUNE: "1"
      # MARIADB_AUTOTUNE_IO: "1"
      # MARIADB_BUFFER_POOL_PERCENT: "60"
      # innodb_flush_neighbors: авто по типу диска, вручную 0|1|2
      # MARIADB_INNODB_FLUSH_NEIGHBORS: "0"
    volumes:
      # Имя тома не должно совпадать с именем каталога проекта:
      # compose соберет из них одно и то же имя и подхватит чужой том
      - mariadb-data:/var/lib/mysql
      # Резервные копии базы данных
      - mariadb-dump:/mariadb-dump
      # Инициализация базы данных: выполняется один раз, при первой инициализации тома.
      # Тестовая таблица test_table с индексом idx_test_table_name, на нее же
      # настроены MARIADB_HEALTHCHECK_TABLE и MARIADB_HEALTHCHECK_INDEX в .env
      - ./init/test_init.sql:/docker-entrypoint-initdb.d/test_init.sql
      # - ./init/latest.sql.gz:/docker-entrypoint-initdb.d/latest.sql.gz
      # - ./init/z1-custom-indexes.sql:/docker-entrypoint-initdb.d/z1-custom-indexes.sql
    sysctls:
      - net.core.somaxconn=10000
    # Для MariaDB 11.8 не требуется, включать только если в логах появятся отказы seccomp
    # security_opt:
    #   - seccomp:unconfined
    cap_add:
      - SYS_NICE
    # HEALTHCHECK задан в образе: штатная проверка базового образа с --connect --innodb_initialized.
    # Полная проверка прав и настроек вынесена в scripts/healthcheck.sh и запускается по требованию,
    # т.к. MySQLTuner в ней занимает ~15s
    # От лимита памяти зависит размер buffer pool, см. autotune/memory.sh.
    # Ниже 512M расчет параметров пропускается (MARIADB_AUTOTUNE_MIN_MB).
    # mem_limit: 2g

volumes:
  mariadb-data:
  mariadb-dump:
